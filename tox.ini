# Tox (https://tox.readthedocs.io/) is a tool for running tests in multiple virtualenvs.

[tox]
envlist =
    lint-py,
    lint-bea,
    lint-vue,
    build-vue,
    test
skipsdist = True

[testenv]
allowlist_externals = *

[testenv:build-vue]
commands = npm run build-vue

[testenv:lint-bea]
commands = ruff check {posargs:bea}

[testenv:lint-py]
commands = ruff check {posargs:application.py boac config consoler.py scripts tests}

[testenv:lint-vue]
commands = npm run lint-vue {posargs}

[testenv:lint-vue-fix]
commands = npm run lint-vue-fix {posargs}

[testenv:oxlint]
commands = npm run oxlint {posargs}

[testenv:test]
pass_env = PGPORT
setenv =
    SQLALCHEMY_WARN_20=1
commands = pytest --durations=10 {posargs: -p no:warnings tests}

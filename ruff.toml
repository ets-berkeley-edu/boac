# Exclude a variety of commonly ignored directories.
exclude = [
    ".ebextensions",
    ".git",
    ".idea",
    ".platform",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    "__pycache__",
    "*-local.py",
    "dist",
    "fixtures",
    "node_modules",
    "public",
    "src",
    "venv"
]
extend-exclude = ["config/development-local.py"]

# Same as Black.
line-length = 150
indent-width = 4

# Python version
target-version = "py311"

[lint]
select = ['ALL']

# TODO: Rules we want to enable:
# B007, C402, C403, C408, C417, DTZ002, DTZ005, DTZ007, FBT002, FBT003, PERF102, PIE800, PIE804, PLR1714, PLR5501,
# PLW2901, PTH113, RET503, RET505, RET506, RET506, RET508, RUF015, SIM102, SIM108, SIM115, SIM118, SIM210, SIM401,
# SIM910, SLF001, TRY300, TRY401, UP012, UP015, UP017, UP028

# Rules to ignore
ignore = [
    "ANN", "ANN202", "ARG001", "B007", "B023", "B904", "B905", "C401", "C402", "C403", "C408", "C416",
    "C417", "D10", "D203", "D211", "D212", "D213", "DTZ", "E731", "EM101", "EM102", "FBT002", "FBT003", "FIX002",
    "FLY002", "G004", "I001", "ICN001", "INP001", "PERF102", "PERF401", "PIE800", "PIE804", "PLC0206",
    "PLC1802", "PLR1714", "PLR1736", "PLR2004", "PLR5501", "PLW0603", "PLW2901", "PTH", "Q000", "RET503", "RET505",
    "RET506", "RET506", "RET508", "RUF005", "RUF012", "RUF015", "S101", "S108", "S311", "S603", "S608", "SIM102",
    "SIM108", "SIM115", "SIM118", "SIM210", "SIM401", "SIM910", "SLF001", "TD002", "TD003", "TRY003", "TRY201",
    "TRY300", "TRY401", "UP012", "UP015", "UP017", "UP028", "W605"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.pylint]
max-args = 21
max-branches = 15
max-statements = 58

[lint.mccabe]
max-complexity = 13

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[lint.per-file-ignores]
"bea/*" = [
    "ARG", "B010", "B018", "C419", "C901", "ERA001", "PLE0704", "PLR091", "PLR1704", "PT026", "Q004", "RUF", "SIM",
    "TD004", "TRY", "UP"
]
